name: Release
on:
  push:
    tags: ['v*.*.*']
jobs:
  create-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out the repo
        uses: actions/checkout@v7
      - name: Create Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create ${{ github.ref_name }} --title "Release ${{ github.ref_name }}" --generate-notes
      - name: Move the major version tag
        run: |
          majorTag="${GITHUB_REF_NAME%%.*}"
          git tag --force "$majorTag"
          git push --force origin "$majorTag"
